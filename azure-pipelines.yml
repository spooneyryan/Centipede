# Build Rustipede and deploy it to Azure App Service.
#
# The client and the server ship as one artifact: the relay serves the static
# files as well as the WebSocket, so they have to be the same deployment or
# the game and its co-op would drift apart in version.
#
# The infrastructure is NOT created here. infra/provision.ps1 owns that, and
# owns it idempotently, so the pipeline can assume the app exists and stay
# about building and shipping. Provisioning from a pipeline means every push
# reasserts your infrastructure, which is how a hand-fixed setting silently
# reverts mid-week.

trigger:
  branches:
    include: [main]

pr:
  branches:
    include: [main]

# GameBase is referenced BY PATH -- vite.config.ts aliases @ccllc/* into it and
# server/Server.csproj holds a ProjectReference to the relay -- so it has to be
# ON DISK beside this repo before anything resolves.
#
# It is developed in another Azure DevOps organisation, which a build's own
# token cannot reach; this points at a MIRROR of it in this one. That is not
# only about avoiding a cross-organisation token. Repository-resource triggers
# only fire within an organisation, so mirroring is also what lets the trigger
# below exist at all.
#
# The mirror does not refresh itself. DEPLOY.md has the one command.
resources:
  repositories:
    - repository: GameBase
      type: git
      name: Centipede/GameBase
      ref: refs/heads/dev
      # Refreshing the mirror runs the checks against the new GameBase. The
      # README has always said to re-run them after pulling GameBase, on the
      # grounds that they are cheap and they are what catches a breaking
      # change; this is that, automatically.
      #
      # It does not deploy. A run triggered by another repository takes
      # Build.SourceBranch from THAT repository, so this arrives as
      # refs/heads/dev and the Deploy stage's condition -- which insists on
      # refs/heads/main -- is false. GameBase can prove the game still works
      # without being able to ship it.
      trigger:
        branches:
          include: [dev]

variables:
  buildConfiguration: Release
  # Set these in the pipeline's own variables, or edit them here.
  azureSubscription: rustipede-arm        # the ARM service connection name
  webAppName: rustipede
  # NOTE ON PATHS. GameBase is found by relative path from two places -- the
  # ../../../GameBase/GameBase/packages that vite.config.ts aliases, and the
  # four levels up out of server/ that Server.csproj's ProjectReference walks.
  # Both land on the same directory, three above the game, so checking the
  # game out at Games/Centipede/TypeScript and GameBase at GameBase/GameBase
  # under one root makes every one of those references resolve untouched.
  #
  # Steps still have to name their working directory: with two repositories
  # the default is that shared root rather than either repository. They spell
  # it out in full rather than through a variable of their own, because
  # $(macro) expansion is not guaranteed to recurse.

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Build
    jobs:
      - job: Build
        steps:
          # With more than one repository every checkout has to be named --
          # including self -- and `path` is what puts them where the relative
          # references expect to find each other.
          - checkout: self
            path: Games/Centipede/TypeScript
            fetchDepth: 1

          - checkout: GameBase
            path: GameBase/GameBase
            fetchDepth: 1

          # Fail here, with a sentence, rather than sixty lines later inside a
          # module resolution error that does not mention checkouts.
          - script: |
              set -e
              test -d "$(Agent.BuildDirectory)/GameBase/GameBase/packages" ||
                { echo "GameBase is not where vite.config.ts expects it."; exit 1; }
              test -f "$(Agent.BuildDirectory)/GameBase/GameBase/packages/relay/CCLLC.Coop.Relay.csproj" ||
                { echo "The relay is not where Server.csproj expects it."; exit 1; }
              echo "GameBase at: $(git -C "$(Agent.BuildDirectory)/GameBase/GameBase" log --oneline -1)"
            displayName: Check the two repositories landed beside each other

          - task: NodeTool@0
            displayName: Node 22
            inputs:
              versionSpec: "22.x"

          - task: UseDotNet@2
            displayName: .NET 10 SDK
            inputs:
              version: "10.0.x"
              includePreviewVersions: true

          # Only this repository installs. GameBase is consumed as source
          # through the vite aliases, and the one thing those sources import
          # from outside themselves -- React -- is already a dependency here.
          # Its own workspace install would add a second React to the tree,
          # which is the exact thing resolve.dedupe exists to undo.
          - script: npm ci
            displayName: npm ci
            workingDirectory: $(Agent.BuildDirectory)/Games/Centipede/TypeScript

          - script: npm run typecheck
            displayName: Typecheck
            workingDirectory: $(Agent.BuildDirectory)/Games/Centipede/TypeScript

          # The determinism proof. It runs two full co-op clients over a
          # simulated laggy link in Node, so a change that would desync two
          # players fails the build rather than the match.
          - script: npm run check
            displayName: Determinism and netcode checks
            workingDirectory: $(Agent.BuildDirectory)/Games/Centipede/TypeScript

          - script: npm run build
            displayName: Build the client
            workingDirectory: $(Agent.BuildDirectory)/Games/Centipede/TypeScript

          - script: dotnet publish server -c $(buildConfiguration) -o $(Build.ArtifactStagingDirectory)/site
            displayName: Publish the server
            workingDirectory: $(Agent.BuildDirectory)/Games/Centipede/TypeScript

          # The client goes INSIDE the publish root. App Service deploys that
          # folder and nothing above it, so the local layout's ../dist does
          # not exist there; Program.cs probes wwwroot first for this reason.
          - script: cp -r dist $(Build.ArtifactStagingDirectory)/site/wwwroot
            displayName: Fold the client into wwwroot
            workingDirectory: $(Agent.BuildDirectory)/Games/Centipede/TypeScript

          - task: ArchiveFiles@2
            displayName: Package
            inputs:
              rootFolderOrFile: $(Build.ArtifactStagingDirectory)/site
              includeRootFolder: false
              archiveType: zip
              archiveFile: $(Build.ArtifactStagingDirectory)/rustipede.zip
              replaceExistingArchive: true

          - publish: $(Build.ArtifactStagingDirectory)/rustipede.zip
            artifact: rustipede

  - stage: Deploy
    # Pull requests build and get checked, but only main ships.
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: Deploy
        environment: rustipede-production
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: rustipede

                - task: AzureWebApp@1
                  displayName: Deploy to App Service
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appType: webAppLinux
                    appName: $(webAppName)
                    package: $(Pipeline.Workspace)/rustipede/rustipede.zip
                    # Matches the runtime provision.ps1 sets.
                    runtimeStack: "DOTNETCORE|10.0"

                # A deploy that returns 200 has proved the site is up. It has
                # not proved the RELAY is up, and the relay is the half that
                # silently breaks -- WebSockets are off by default on App
                # Service, and when they are off nothing appears in the log
                # because the request never reaches the app.
                #
                # A plain GET to the socket path must answer 400
                # (not-a-websocket-request). 404 means the app is not routing
                # it; anything else means the relay is not running.
                - script: |
                    set -e
                    url="https://$(webAppName).azurewebsites.net"
                    echo "Waiting for $url to come back up..."
                    for i in $(seq 1 30); do
                      code=$(curl -s -o /dev/null -w '%{http_code}' "$url/" || true)
                      if [ "$code" = "200" ]; then break; fi
                      sleep 5
                    done
                    test "$code" = "200" || { echo "Site did not return 200 (got $code)"; exit 1; }
                    echo "Site is up."

                    relay=$(curl -s -o /dev/null -w '%{http_code}' "$url/ws/mp" || true)
                    echo "Relay probe returned $relay"
                    if [ "$relay" != "400" ]; then
                      echo "The relay is not answering. 400 is expected here:"
                      echo "it means the endpoint exists and refused a non-WebSocket request."
                      echo "Check that WebSockets are enabled: infra/provision.ps1 sets this."
                      exit 1
                    fi
                    echo "Relay is up."
                  displayName: Smoke test the site and the relay
